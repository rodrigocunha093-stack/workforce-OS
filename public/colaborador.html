<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minha Escala · EscalaON</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 46 46'%3E%3Crect width='46' height='46' rx='13' fill='%232563EB'/%3E%3Cpath d='M15.2 15.2 A11 11 0 1 0 30.8 15.2' stroke='%23FFFFFF' stroke-width='3.2' stroke-linecap='round' fill='none'/%3E%3Crect x='21.4' y='8.6' width='3.2' height='6' rx='1.6' fill='%23FFFFFF'/%3E%3Crect x='21.4' y='16.2' width='3.2' height='6.2' rx='1.6' fill='%23FFFFFF'/%3E%3C/svg%3E">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background: #151b26;
      color: #c2cbd8; min-height: 100vh; padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 460px; margin: 0 auto; }
    .brand { display: flex; align-items: center; gap: 12px; justify-content: center; margin: 24px 0 32px; }
    .brand-logo { width: 44px; height: 44px; border-radius: 13px; background: #2563EB; display: grid; place-items: center; }
    .brand h1 { font-size: 22px; letter-spacing: -0.01em; }
    .brand .ac { color: #3B82F6; }
    .card { background: #1d2532; border: 1px solid rgba(148,163,184,0.16); border-radius: 16px; padding: 24px; }
    .card h2 { font-size: 17px; margin-bottom: 6px; }
    .card p.sub { color: #8e9cb0; font-size: 13px; margin-bottom: 18px; }
    label { display: block; font-size: 12px; color: #8e9cb0; margin: 12px 0 5px; }
    input { width: 100%; padding: 12px 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(148,163,184,0.25); border-radius: 10px; color: #c2cbd8; font-size: 15px; }
    input:focus { outline: none; border-color: #3B82F6; box-shadow: 0 0 0 3px rgba(59,130,246,0.18); }
    button { width: 100%; margin-top: 18px; padding: 13px; background: #2563EB; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .err { color: #fca5a5; font-size: 13px; margin-top: 12px; text-align: center; }
    .result { margin-top: 20px; }
    .result-head { text-align: center; margin-bottom: 18px; }
    .result-head .nm { font-size: 20px; }
    .result-head .meta { color: #8e9cb0; font-size: 13px; margin-top: 4px; }
    .dia { display: flex; justify-content: space-between; align-items: center; padding: 13px 16px; margin-bottom: 8px; background: rgba(255,255,255,0.04); border: 1px solid rgba(148,163,184,0.14); border-radius: 12px; }
    .dia.folga { opacity: 0.65; }
    .dia .d { font-weight: 700; font-size: 14px; }
    /* O horário é o herói desta tela: numerais tabulares alinham a coluna. */
    .dia .t { font-size: 15px; font-weight: 600; color: #d3dae5; font-variant-numeric: tabular-nums; }
    .dia.folga .t { color: #8e9cb0; font-weight: 400; }
    .dia.hoje { border-color: #3B82F6; box-shadow: 0 0 0 1px rgba(59,130,246,0.35); }
    .back { display: block; text-align: center; margin-top: 18px; color: #8e9cb0; font-size: 13px; cursor: pointer; }
    .foot { text-align: center; color: #64748b; font-size: 11px; margin-top: 28px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <span class="brand-logo">
        <svg width="26" height="26" viewBox="0 0 46 46" fill="none"><path d="M15.2 15.2 A11 11 0 1 0 30.8 15.2" stroke="#fff" stroke-width="3.6" stroke-linecap="round" fill="none"/><rect x="21.4" y="8.6" width="3.2" height="6" rx="1.6" fill="#fff"/><rect x="21.4" y="16.2" width="3.2" height="6.2" rx="1.6" fill="#fff"/></svg>
      </span>
      <h1>Escala<span class="ac">ON</span></h1>
    </div>

    <div class="card" id="loginCard">
      <h2>Consultar minha escala</h2>
      <p class="sub">Digite o código da sua empresa e seu nome para ver seus turnos da semana.</p>
      <label>Código da empresa</label>
      <input id="orgCode" placeholder="EMP-XXXXXX" autocomplete="off">
      <label>Seu nome</label>
      <input id="nome" placeholder="Como está no cadastro" autocomplete="off">
      <button id="btn">Ver minha escala</button>
      <div class="err" id="err"></div>
    </div>

    <div class="card result" id="resultCard" style="display:none"></div>

    <p class="foot">EscalaON · uma solução <a href="https://www.contagilpb.com.br" target="_blank" style="color:#93c5fd;text-decoration:none">Contagil</a> · Especialistas em Contabilidade para o Varejo</p>
  </div>

  <script>
    const dias = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado', 'Domingo'];
    const hojeIdx = (new Date().getDay() + 6) % 7; // seg=0
    document.getElementById('btn').onclick = async () => {
      const orgCode = document.getElementById('orgCode').value.trim();
      const nome = document.getElementById('nome').value.trim();
      const err = document.getElementById('err');
      err.textContent = '';
      if (!orgCode || !nome) { err.textContent = 'Preencha código e nome.'; return; }
      try {
        const r = await fetch('/api/colaborador/escala', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ orgCode, nome }) });
        const d = await r.json();
        if (!d.ok) { err.textContent = d.error; return; }
        document.getElementById('loginCard').style.display = 'none';
        const rc = document.getElementById('resultCard');
        rc.style.display = 'block';
        rc.innerHTML = `
          <div class="result-head">
            <div class="nm">${d.nome}</div>
            <div class="meta">${d.cargo}${d.setor ? ' · ' + d.setor : ''} · ${d.empresa}</div>
            <div class="meta">${d.label}</div>
          </div>
          ${d.escala.map((t, i) => `
            <div class="dia ${t === 'Folga' ? 'folga' : ''} ${i === hojeIdx ? 'hoje' : ''}">
              <span class="d">${dias[i]}${i === hojeIdx ? ' • hoje' : ''}</span>
              <span class="t">${t}</span>
            </div>
          `).join('')}
          <span class="back" onclick="location.reload()">← Consultar outro</span>
        `;
      } catch (e) { err.textContent = 'Erro de conexão. Tente novamente.'; }
    };
    document.getElementById('nome').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btn').click(); });
  </script>
</body>
</html>
