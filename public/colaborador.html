<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minha Escala · EscalaON</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 46 46'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='46' y2='46' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%2334d399'/%3E%3Cstop offset='.55' stop-color='%232dd4bf'/%3E%3Cstop offset='1' stop-color='%233b82f6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='46' height='46' rx='13' fill='url(%23g)'/%3E%3Cpath d='M16 23.5L21 28.5L31 17.5' stroke='%23fff' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, sans-serif;
      background: radial-gradient(1000px 600px at 50% -10%, rgba(45,212,191,0.12), transparent 60%), #0a0e1a;
      color: #e8eef5; min-height: 100vh; padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 460px; margin: 0 auto; }
    .brand { display: flex; align-items: center; gap: 12px; justify-content: center; margin: 24px 0 32px; }
    .brand-logo { width: 44px; height: 44px; border-radius: 13px; background: linear-gradient(135deg,#34d399,#2dd4bf,#3b82f6); display: grid; place-items: center; box-shadow: 0 0 20px -2px rgba(45,212,191,0.6); }
    .brand h1 { font-family: 'Space Grotesk', sans-serif; font-size: 22px; }
    .brand .ac { background: linear-gradient(90deg,#34d399,#3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .card { background: rgba(20,27,46,0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 24px; box-shadow: 0 8px 32px -12px rgba(0,0,0,0.6); }
    .card h2 { font-size: 17px; margin-bottom: 6px; font-family: 'Space Grotesk', sans-serif; }
    .card p.sub { color: #94a3b8; font-size: 13px; margin-bottom: 18px; }
    label { display: block; font-size: 12px; color: #94a3b8; margin: 12px 0 5px; }
    input { width: 100%; padding: 12px 14px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; color: #e8eef5; font-size: 15px; }
    input:focus { outline: none; border-color: #2dd4bf; box-shadow: 0 0 0 3px rgba(45,212,191,0.15); }
    button { width: 100%; margin-top: 18px; padding: 13px; background: linear-gradient(135deg,#2dd4bf,#3b82f6); color: #051014; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; }
    button:hover { opacity: 0.92; }
    .err { color: #fca5a5; font-size: 13px; margin-top: 12px; text-align: center; }
    .result { margin-top: 20px; }
    .result-head { text-align: center; margin-bottom: 18px; }
    .result-head .nm { font-size: 20px; font-family: 'Space Grotesk', sans-serif; }
    .result-head .meta { color: #94a3b8; font-size: 13px; margin-top: 4px; }
    .dia { display: flex; justify-content: space-between; align-items: center; padding: 13px 16px; margin-bottom: 8px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; }
    .dia.folga { opacity: 0.6; }
    .dia .d { font-weight: 700; font-size: 14px; }
    .dia .t { font-family: 'Space Grotesk', sans-serif; font-size: 15px; color: #5eead4; }
    .dia.folga .t { color: #94a3b8; }
    .dia.hoje { border-color: #2dd4bf; box-shadow: 0 0 0 1px rgba(45,212,191,0.3); }
    .back { display: block; text-align: center; margin-top: 18px; color: #94a3b8; font-size: 13px; cursor: pointer; }
    .foot { text-align: center; color: #475569; font-size: 11px; margin-top: 28px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <span class="brand-logo">
        <svg width="26" height="26" viewBox="0 0 46 46" fill="none"><path d="M16 23.5L21 28.5L31 17.5" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <h1>Tá<span class="ac">Ótimo!</span></h1>
    </div>

    <div class="card" id="loginCard">
      <h2>Consultar minha escala</h2>
      <p class="sub">Digite o código da sua empresa e seu nome para ver seus turnos da semana.</p>
      <label>Código da empresa</label>
      <input id="orgCode" placeholder="EMP-XXXXXX" autocomplete="off">
      <label>Seu nome</label>
      <input id="nome" placeholder="Como está no cadastro" autocomplete="off">
      <button id="btn">Ver minha escala</button>
      <div class="err" id="err"></div>
    </div>

    <div class="card result" id="resultCard" style="display:none"></div>

    <p class="foot">EscalaON · uma solução <a href="https://www.contagilpb.com.br" target="_blank" style="color:#93c5fd;text-decoration:none">Contagil</a> · Especialistas em Contabilidade para o Varejo</p>
  </div>

  <script>
    const dias = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado', 'Domingo'];
    const hojeIdx = (new Date().getDay() + 6) % 7; // seg=0
    document.getElementById('btn').onclick = async () => {
      const orgCode = document.getElementById('orgCode').value.trim();
      const nome = document.getElementById('nome').value.trim();
      const err = document.getElementById('err');
      err.textContent = '';
      if (!orgCode || !nome) { err.textContent = 'Preencha código e nome.'; return; }
      try {
        const r = await fetch('/api/colaborador/escala', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ orgCode, nome }) });
        const d = await r.json();
        if (!d.ok) { err.textContent = d.error; return; }
        document.getElementById('loginCard').style.display = 'none';
        const rc = document.getElementById('resultCard');
        rc.style.display = 'block';
        rc.innerHTML = `
          <div class="result-head">
            <div class="nm">${d.nome}</div>
            <div class="meta">${d.cargo}${d.setor ? ' · ' + d.setor : ''} · ${d.empresa}</div>
            <div class="meta">${d.label}</div>
          </div>
          ${d.escala.map((t, i) => `
            <div class="dia ${t === 'Folga' ? 'folga' : ''} ${i === hojeIdx ? 'hoje' : ''}">
              <span class="d">${dias[i]}${i === hojeIdx ? ' • hoje' : ''}</span>
              <span class="t">${t}</span>
            </div>
          `).join('')}
          <span class="back" onclick="location.reload()">← Consultar outro</span>
        `;
      } catch (e) { err.textContent = 'Erro de conexão. Tente novamente.'; }
    };
    document.getElementById('nome').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btn').click(); });
  </script>
</body>
</html>
